.page{max-width:1700px;padding:40px 32px 38px}

/* Reveal only newly submitted row, one property at a time. */
.guess-board td.cell{transition:opacity .28s ease,transform .28s cubic-bezier(.2,.72,.22,1),filter .28s ease;transform-origin:50% 50%}
.guess-board td.cell.tile-pending{opacity:0;transform:translateY(10px) rotateX(-75deg) scale(.90);filter:blur(2px)}
.guess-board td.cell.tile-revealed{animation:petrodle-pop .36s cubic-bezier(.17,.82,.32,1.15) both}
@keyframes petrodle-pop{0%{transform:translateY(10px) rotateX(-65deg) scale(.89);opacity:0}66%{transform:translateY(-3px) rotateX(5deg) scale(1.025);opacity:1}100%{transform:none;opacity:1}}

@keyframes firework-ray{0%{opacity:0;transform:rotate(var(--angle)) translateY(0) scale(.2)}18%{opacity:.85}75%{opacity:.68}100%{opacity:0;transform:rotate(var(--angle)) translateY(-95px) scale(.35)}}
