name: Testes do Petrodle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar jogo, catálogo, auditoria e progresso
        run: node --test
      - name: Verificar acervo exportado
        run: node scripts/export-photos.cjs --check
      - name: Instalar ferramentas de teste do navegador
        run: npm install --prefix "$RUNNER_TEMP/petrodle-browser" --no-package-lock --no-audit --no-fund playwright-core@1.65.1 @axe-core/playwright@4.14.0
      - name: Verificar fluxos e acessibilidade no Chrome
        run: NODE_PATH="$RUNNER_TEMP/petrodle-browser/node_modules" node tests/browser/verify.cjs
